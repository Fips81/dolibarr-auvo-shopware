name: Build release ZIP

on:
  push:
    tags:
      - 'v*'

jobs:
  build-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # Pinned by SHA (supply chain): checkout v7.0.1 (Node 24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Tag matches module version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MODVER=$(grep -oP "\\\$this->version = '\K[^']+" core/modules/modAuVoShopware.class.php)
          echo "Tag $VERSION, module $MODVER"
          test "$VERSION" = "$MODVER"

      - name: Lint PHP
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build clean ZIP (root folder auvoshopware/, DoliStore name module_<name>-x.y.z.zip)
        run: |
          # DoliStore expects the makepack format module_<name>-x.y(.z).zip
          # (prefix module_, version WITHOUT the "v" of the tag).
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/build/auvoshopware
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='/build' \
            ./ /tmp/build/auvoshopware/
          cd /tmp/build && zip -r "/tmp/module_auvoshopware-${VERSION}.zip" auvoshopware/
          unzip -l "/tmp/module_auvoshopware-${VERSION}.zip"

      - name: Attach ZIP to release
        # softprops/action-gh-release v3.0.4, pinned by SHA (Node 24)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: /tmp/module_auvoshopware-*.zip
          fail_on_unmatched_files: true
