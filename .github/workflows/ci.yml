name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # Pinned by SHA (supply chain): v7.0.1 (Node 24)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint PHP
        run: |
          php -v
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "PHP lint OK"

      - name: Language files de_DE and en_US have the same keys
        run: |
          keys() { grep -oE '^[A-Za-z0-9_]+ *=' "$1" | tr -d ' =' | sort; }
          diff <(keys langs/de_DE/auvoshopware.lang) <(keys langs/en_US/auvoshopware.lang)
          echo "Language keys OK"
